<VirtualHost *:${APACHE_PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # "Slash arguments" URLs such as /pluginfile.php/1/mod_resource/content/0/file.pdf
        AcceptPathInfo On

        # Moodle 5.1+ router: anything that is not a real file/dir goes to /r.php.
        # Done with mod_rewrite (not FallbackResource) because FallbackResource is skipped for
        # non-existent *.php paths, which Moodle's router "shim" routes rely on. It must live in
        # the <Directory> context so slash-argument URLs (/pluginfile.php/1/...) still map to
        # the real script via AcceptPathInfo before the file test.
        RewriteEngine On
        # A directory with no index.php (e.g. /lib/classes/) is a 404, not Apache's 403.
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteCond %{REQUEST_FILENAME}/index.php !-f
        RewriteRule ^ - [R=404]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /r.php [L]
    </Directory>

    # Hide sensitive/non-public files (Moodle security recommendations). 404 rather than 403, as
    # that is what Moodle's "public paths" security check expects.
    RewriteEngine On
    RewriteRule "(\/vendor\/)" - [R=404]
    RewriteRule "(\/node_modules\/)" - [R=404]
    RewriteRule "(^|/)\.(?!well-known\/)" - [R=404]
    RewriteRule "(composer\.json)" - [R=404]
    RewriteRule "(\.lock)" - [R=404]
    RewriteRule "(\/environment.xml)" - [R=404]
    RewriteRule "(\/install.xml)" - [R=404]
    RewriteRule "(\/README)" - [R=404]
    RewriteRule "(\/readme)" - [R=404]
    RewriteRule "(\/moodle_readme)" - [R=404]
    RewriteRule "(\/(upgrade\.txt|UPGRADING\.md|UPGRADING\-CURRENT\.md))" - [R=404]
    RewriteRule "(phpunit\.xml\.dist)" - [R=404]
    RewriteRule "(\/tests\/behat\/)" - [R=404]
    RewriteRule "(\/fixtures\/)" - [R=404]

    # Compress text responses.
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/javascript application/json image/svg+xml

    # Logs go to stdout/stderr (Docker log driver).
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
