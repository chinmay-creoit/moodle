; PHP settings for Moodle 5.3 (see public/admin/environment.xml for the checked values).
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
upload_max_filesize = 256M
post_max_size = 256M
file_uploads = 1
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
; Moodle environment check recommends this.
zend.exception_ignore_args = 1

; OPcache sized for Moodle's ~tens of thousands of PHP files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 60000
opcache.revalidate_freq = 60
